; Bitrix-совместимые настройки PHP
upload_max_filesize  = 200M
post_max_size        = 200M
max_execution_time   = 300
max_input_time       = 300
memory_limit         = 256M
short_open_tag       = On
session.save_path    = /tmp

; Показываем ошибки в браузере — чтобы белый экран сразу давал текст ошибки
display_errors  = On
display_startup_errors = On
error_reporting = E_ALL

; Дополнительно логируем в файл (docker compose logs web)
log_errors  = On
error_log   = /var/log/apache2/php_errors.log

; Bitrix использует mbstring без перегрузки функций
mbstring.func_overload = 0

[opcache]
opcache.enable            = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq   = 0
